project:
  name: SL-RDAF
  paper: Checkpoint-Level Multi-Horizon Reliability Diagnosis for LLM-Based Agent Systems in Industrial IoT
  section_scope: Section 3.2 Checkpoint-level Observable Representation

scope:
  include:
    - checkpoint_sequence_construction
    - verification_result_generation
    - dependency_set_E_minus_extraction
    - perturbation_response_record_generation
    - observation_plane_assembly
  exclude:
    - diagnostic_feature_construction
    - model_training
    - calibration
    - threshold_selection
    - heldout_evaluation
    - visualization

determinism:
  temperature: 0
  random_seed: 20260528
  seed_source: "D:\\SL-RDAF\\outputs\\training\\train_config_frozen.json"
  temperature_note: "Old project did not explicitly freeze temperature; SL-RDAF requires deterministic generation."
  seed_note: "Used for deterministic observation-plane construction and perturbation sampling."

llm:
  final_version: null
  status: requires_confirmation
  legacy_candidate: qwen-turbo
  legacy_source: "D:\\SL-RDAF\\Material\\ExternalFalsifiableMeasurementforSubmission\\configs\\experiment_config.yaml"
  usage_policy: do_not_call_llm_unless_confirmed_and_raw_traces_missing
  note: "Legacy project used qwen-turbo, but SL-RDAF final protocol does not confirm it."

