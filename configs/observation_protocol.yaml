model_architecture:
  task: Text-to-SQL structured reasoning
  channels:
    direction:
      symbol: x_dir_i_t
      dimension: 5
      fields:
      - 1-A_i_t
      - H_i_t
      - rho_i_t
      - I_minus_i_t
      - I_plus_i_t
      description: Preserves variables with explicit risk directions
    residual:
      symbol: x_res_i_t
      dimension: 11
      fields:
      - U_i_t
      - Delta(1-A_i_t)
      - Delta_H_i_t
      - log(1+t)
      - phase_one-hot
      - complexity_tier_one-hot
      description: Preserves local changes and context information
  recursive_state:
    symbol: s_i_t
    dimension: 8
    description: Recursive correctness state
  parameters:
    total: 167
    description: Learnable model weights
  observation_rows_per_parameter: 64.6
  deep_nesting_boundary:
    in_model_input: false
    usage: Complexity stratification analysis and case selection only
