  rule_library_provenance_id: legacy_rules_sha256_72b341a9063d
  rule_files:
    - path: "D:\\SL-RDAF\\Material\\ExternalFalsifiableMeasurementforSubmission\\code\\verifier\\constraint_rules.py"
      sha256: 72b341a9063d8ae76ea06d4ee3a0a260f9482b9908eaca04e4e4ac74776958f3
    - path: "D:\\SL-RDAF\\Material\\ExternalFalsifiableMeasurementforSubmission\\code\\verifier\\vsp_verifier.py"
      sha256: 0cb791325e3479cc0feb7cd47db0713696a44817c944b230ce989222d3ab72a2
  verification_repeats: null
  N: null
  M: null
  legacy_related_values:
    n_candidates_per_step: 30
    note: "Related to VSP candidate generation, not confirmed as verification repeat count."

perturbation:
  perturbation_family_version: null
  status: incomplete_requires_confirmation
  provenance_id: legacy_perturbation_sha256_36acc45cf00a
  legacy_partial_definition:
    inject_ratio: 0.2
    source: "D:\\SL-RDAF\\Material\\ExternalFalsifiableMeasurementforSubmission\\configs\\experiment_config.yaml"
  random_seed: 20260528
  payload_storage_policy: store_hash_or_safe_summary_only

splits:
  train_dev:
    samples: 324
    rows: 3928
  cal_dev:
    samples: 214
    rows: 2571
  heldout:
    samples: 365
    rows: 4289
    policy: no_refit_no_calibration_no_threshold_selection
  total_samples: 903
  total_observation_rows: 10788
  legacy_value: "[214, 320]"
  conflict_resolution: "Use SL-RDAF three-way split; legacy binary split is obsolete."
  source:
    - "D:\\SL-RDAF\\Material\\SL-RDAF_algorithm_framework_phase1_phase2_phase3.md"
    - "D:\\SL-RDAF\\data\\原始数据\\dataset_warning_fixed\\README_dataset_v1.0.md"
    - "D:\\SL-RDAF\\outputs\\diagnostics_4_2\\agent_cluster_package\\README_for_agent_cluster.md"

observation_boundary:
  allowed_information:
    - current_checkpoint
    - historical_checkpoints
    - schema_or_database_information_available_at_verification_time
    - external_rule_results
    - predecessor_perturbation_responses
  forbidden_information:
    - future_checkpoints
    - tau_i
    - first_degradation
    - final_execution_label
    - endpoint_accuracy
    - execution_accuracy
    - y_i_t_h
    - calibrated_risk
    - model_prediction
    - heldout_metric
  leakage_policy: fail_closed

outputs:
  primary: observation_planes.jsonl
  auxiliary:
    - checkpoints.jsonl
    - verification_results.jsonl
    - dependency_sets.jsonl
    - perturbation_responses.jsonl
    - observation_plane_build_report.json
    - observation_plane_validation_report.json
